// Gradle init script used by scripts/build.sh when LINT=1. Restricts Android Lint to NewApi,
// so only API-floor regressions fail, without editing upstream's build.gradle.kts.
// TS_LINT_CONFIG, when set, points at patches/lint.xml, the commented ignore file.
allprojects {
    plugins.withId('com.android.application') {
        androidComponents {
            finalizeDsl { android ->
                android.lint {
                    checkOnly.clear()
                    checkOnly.add('NewApi')
                    def cfg = System.getenv('TS_LINT_CONFIG')
                    if (cfg) lintConfig = new File(cfg)
                }
            }
        }
    }
}
