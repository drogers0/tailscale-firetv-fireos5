name: CI
on:
  pull_request:
  push:
    branches: [main]          # seeds caches PRs can read: setup-gradle saves only here, and
                              # actions/cache entries saved from main are visible to every PR
  workflow_call:              # upstream-drift.yml runs tiers 0-2 against another ref
    inputs:
      ts_ref: { type: string, default: '' }
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:                          # empty unless called: build.sh falls back to its pinned default
  TS_REF: ${{ inputs.ts_ref }}
jobs:
  changes:
    # Docs-only PRs skip every tier. A job skipped by its `if` counts as passed for required
    # checks, which a workflow-level paths-ignore would leave pending forever.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
            [ -n "$files" ] || { echo "::error::no changed files listed for PR $PR"; exit 1; }
            printf '%s\n' "$files" | grep -vE '\.md$|^docs/' >/dev/null || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  check:
    name: Tier 0 · static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: make check        # uses the image's SDK for aapt2; no JDK needed
  build:
    name: Tier 1 · build, NewApi lint, unit tests
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25        # cold runs take about 7 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ inputs.ts_ref && 'drift' || 'tier1' }}
          save-sdk: 'true'     # the only writer of the shared SDK cache entry
      - run: make build
        env: { LINT: '1', SKIP_TESTS: '0' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-fireos5-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports
          path: .build/*/android/build/reports/
          if-no-files-found: ignore
          retention-days: 14
  emulator:
    name: Tier 2 · API 22 emulator smoke tests
    needs: check
    # Every run except PRs to other bases: pushes (main only) and drift's calls, where tier 2
    # gates the bump PR. Only PR and push runs save caches: a called workflow sees the caller's
    # event.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25        # cold runs take about 11 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-build
        with:
          cache-key: emulator  # save-sdk stays 'false': emulator packages never enter the shared SDK entry
          save: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      - uses: ./.github/actions/setup-emulator
        with:
          save: ${{ github.event_name == 'push' }}  # only main pushes write the emulator entry
      - run: make build-emu emu-test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-test-logs
          path: .build/emu-test/
          if-no-files-found: ignore
          retention-days: 14
