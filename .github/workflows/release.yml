name: Release
on:
  push:
    tags: ['*-fireos5-r[0-9]*']   # <upstream version>-fireos5-r<N>, e.g. 1.104.5-fireos5-r1
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
env:
  TAG: ${{ github.ref_name }}
jobs:
  build:
    # Runs upstream's build, so it gets neither the signing secrets nor a write token.
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25          # cold runs take about 7 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }   # history, for the on-main check
      - name: Check the tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-fireos5-r[1-9][0-9]*$ ]] \
            || { echo "::error::$TAG is not <upstream version>-fireos5-r<N>"; exit 1; }
          version="${BASH_REMATCH[1]}"
          pinned="$(sed -n 's/^PINNED_REF=//p' scripts/build.sh)"
          [ "$version" = "${pinned%%-*}" ] \
            || { echo "::error::$TAG names $version, but scripts/build.sh pins ${pinned:-nothing}"; exit 1; }
          # Everything on main passed the required checks. This catches a mistyped tag; it is
          # not a security boundary (anyone who can push a tag can tag a commit without it).
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
      # tier1's exact key: main's tier 1 builds this same PINNED_REF. Restore-only, because a
      # tag-scoped entry could never be restored by another run.
      - uses: ./.github/actions/setup-build
        with: { cache-key: tier1, save: 'false' }
      - run: make build              # verify-apk runs inside, --require-version-code included
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
  release:
    name: Sign and draft the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: unsigned-apk, path: dist }
      - name: Refuse to replace a release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          # Drafts included; GET /releases/tags/{tag} would see only published releases.
          n="$(gh release list --limit 1000 --json tagName --jq "map(select(.tagName == \"$TAG\")) | length")"
          [ "$n" = 0 ] || { echo "::error::a release for $TAG exists (draft or published); delete it to rebuild"; exit 1; }
      - name: Sign
        env:
          TS_KEYSTORE_BASE64: ${{ secrets.TS_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASSWORD: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.TS_KEY_ALIAS }}
        run: scripts/sign-apk.sh dist/*.apk   # re-signs in place, checks CERT_SHA256, writes the .sha256
      - name: Draft the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          apk="$(echo dist/*.apk)"
          scripts/release-notes.sh "$TAG" "$apk" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --verify-tag \
            --title "Tailscale ${TAG%-fireos5-r*} for Fire OS 5 — r${TAG##*-r}" \
            --notes-file "$RUNNER_TEMP/notes.md" "$apk" "$apk.sha256"
